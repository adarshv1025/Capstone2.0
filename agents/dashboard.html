<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --good: #0ca30c;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255,255,255,0.10);
    }
  }
  :root[data-theme="dark"] {
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255,255,255,0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    padding: 16px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 4px 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin: 0 0 20px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 600; }
  .card .value.good { color: var(--good); }
  .card .value.critical { color: var(--critical); }
  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .narrative {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 20px;
    font-size: 15px;
    line-height: 1.55;
  }
  .narrative .tag {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  canvas { max-height: 320px; }
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .charts-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>ESG Dashboard</h1>
  <p class="subtitle">Intelligent Decentralized Logistics Framework &mdash; Bengaluru</p>

  <div class="cards" id="cards"></div>

  <div class="narrative">
    <div class="tag">ESG Reporter summary</div>
    <div id="narrative-text"></div>
  </div>

  <div class="panel">
    <h2>Expected vs. simulated-actual time per route (mixed_priority scenario)</h2>
    <canvas id="routeTimeChart"></canvas>
  </div>

  <div class="charts-row">
    <div class="panel">
      <h2>Total planned time by system, per scenario</h2>
      <canvas id="systemTimeChart"></canvas>
    </div>
    <div class="panel">
      <h2>Total planned carbon by system, per scenario</h2>
      <canvas id="systemCarbonChart"></canvas>
    </div>
  </div>
</div>

<script>
const DATA = {"cards": [{"label": "Total planned time (no delays)", "value": "10,521 s"}, {"label": "Total expected time (typical delays)", "value": "14,141 s"}, {"label": "Total actual (simulated) time", "value": "14,102 s"}, {"label": "Total planned carbon (no delays)", "value": "25.8 kg"}, {"label": "Total expected carbon (typical delays)", "value": "34.0 kg"}, {"label": "Total actual (simulated) carbon", "value": "33.9 kg"}, {"label": "Mean abs. time deviation", "value": "4.2%"}, {"label": "EV feasibility rate", "value": "100.0%", "status": "good"}, {"label": "Negotiation rounds used", "value": "3"}, {"label": "Carbon saved by optimizer", "value": "0.0 kg"}], "summary_text": "The batch of 5 deliveries was fully routed with no unassigned or failed requests. All deliveries arrived on time \u2013 the on\u2011time rate was 100% and the actual travel time (\u224814,102\u202fs, about 3.92\u202fh) was just 38\u202fs under the expected 14,141\u202fs, giving an average time deviation of only 4.2%. Every route was compatible with electric vehicles (100% EV feasibility) and the batch required only three negotiation rounds to resolve any conflicts. Carbon emissions were essentially on target, with actual emissions of 33.93\u202fkg versus the expected 34.01\u202fkg, and the optimizer\u2019s swaps saved a negligible 0.0002\u202fkg. Overall the run shows strong operational performance, though the carbon\u2011saving impact of the optimizer was minimal.", "per_route": [{"request_id": "mp-0", "planned_time_s": 830.1526399, "expected_time_s": 1111.8630126800756, "actual_time_s": 1048.202961599344}, {"request_id": "mp-1", "planned_time_s": 2304.7800531, "expected_time_s": 3148.1180863700833, "actual_time_s": 3392.694132554666}, {"request_id": "mp-2", "planned_time_s": 2670.43413138, "expected_time_s": 3630.0530993096086, "actual_time_s": 3637.905881162483}, {"request_id": "mp-3", "planned_time_s": 2581.63274001, "expected_time_s": 3400.939223769309, "actual_time_s": 3254.4699944803892}, {"request_id": "mp-4", "planned_time_s": 2134.45922675, "expected_time_s": 2849.7663692918127, "actual_time_s": 2769.137896792772}], "comparison": {"scenarios": ["edge_overload", "ev_feasible", "ev_infeasible", "large_batch", "mixed_priority"], "datasets_time": [{"label": "Multi-Agent System", "color": "#2a78d6", "data": [6533.9109836294, 1260.350803284, 1966.867771346, 21424.2275403236, 10896.0248646634]}, {"label": "Baseline (time-only)", "color": "#eb6834", "data": [6231.38219811, 1215.31507148, 1801.6882636254, 20427.4239184536, 10381.9029831458]}, {"label": "Baseline (carbon-only)", "color": "#1baf7a", "data": [6518.713850964001, 1260.350803284, 1993.959877126, 23651.3240531768, 11215.302194575]}], "datasets_carbon": [{"label": "Multi-Agent System", "color": "#2a78d6", "data": [20.55500578842, 2.34579250196, 4.34687839052, 53.9122804317946, 26.4446685129348]}, {"label": "Baseline (time-only)", "color": "#eb6834", "data": [21.23249850078, 2.89017185994, 4.889144109, 55.3613881857166, 29.0994316400028]}, {"label": "Baseline (carbon-only)", "color": "#1baf7a", "data": [19.6647558819, 2.34579250196, 4.26457886956, 53.840957009588, 24.2767185255948]}]}, "ink": {"primary": "#0b0b0b", "secondary": "#52514e", "muted": "#898781"}, "surface": {"chart": "#fcfcfb", "page": "#f9f9f7", "grid": "#e1e0d9", "border": "rgba(11,11,11,0.10)"}, "status": {"good": "#0ca30c", "critical": "#d03b3b"}};

function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
const dark = isDark();
const ink = dark ? '#ffffff' : DATA.ink.primary;
const inkSecondary = dark ? '#c3c2b7' : DATA.ink.secondary;
const grid = dark ? '#2c2c2a' : DATA.surface.grid;

Chart.defaults.font.family = "system-ui, -apple-system, 'Segoe UI', sans-serif";
Chart.defaults.color = inkSecondary;
Chart.defaults.borderColor = grid;

// Stat cards
const cardsEl = document.getElementById('cards');
DATA.cards.forEach(c => {
  const div = document.createElement('div');
  div.className = 'card';
  const valueClass = c.status ? `value ${c.status}` : 'value';
  div.innerHTML = `<div class="label">${c.label}</div><div class="${valueClass}">${c.value}</div>`;
  cardsEl.appendChild(div);
});

document.getElementById('narrative-text').textContent = DATA.summary_text;

// Chart 1: per-route expected (plan incl. typical delays) vs actual time
new Chart(document.getElementById('routeTimeChart'), {
  type: 'bar',
  data: {
    labels: DATA.per_route.map(r => r.request_id),
    datasets: [
      {
        label: 'Expected, with typical delays (s)',
        data: DATA.per_route.map(r => r.expected_time_s),
        backgroundColor: '#2a78d6',
        borderRadius: 4,
        categoryPercentage: 0.7,
        barPercentage: 0.9,
      },
      {
        label: 'Actual, simulated (s)',
        data: DATA.per_route.map(r => r.actual_time_s),
        backgroundColor: '#eb6834',
        borderRadius: 4,
        categoryPercentage: 0.7,
        barPercentage: 0.9,
      },
    ],
  },
  options: {
    responsive: true,
    plugins: { legend: { position: 'top', labels: { color: inkSecondary } } },
    scales: {
      x: { grid: { display: false }, ticks: { color: inkSecondary } },
      y: { grid: { color: grid }, ticks: { color: inkSecondary }, beginAtZero: true },
    },
  },
});

function systemComparisonChart(canvasId, datasets, yLabel) {
  new Chart(document.getElementById(canvasId), {
    type: 'bar',
    data: {
      labels: DATA.comparison.scenarios,
      datasets: datasets.map(d => ({
        label: d.label,
        data: d.data,
        backgroundColor: d.color,
        borderRadius: 4,
        categoryPercentage: 0.7,
        barPercentage: 0.85,
      })),
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top', labels: { color: inkSecondary, boxWidth: 12 } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: inkSecondary, maxRotation: 30, minRotation: 0 } },
        y: { grid: { color: grid }, ticks: { color: inkSecondary }, beginAtZero: true, title: { display: true, text: yLabel, color: inkSecondary } },
      },
    },
  });
}

systemComparisonChart('systemTimeChart', DATA.comparison.datasets_time, 'seconds');
systemComparisonChart('systemCarbonChart', DATA.comparison.datasets_carbon, 'kg CO2');
</script>
</body>
</html>
